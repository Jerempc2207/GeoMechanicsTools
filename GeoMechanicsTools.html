<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoMechanicsTools</title>
    <link rel="icon" type="image/png" href="assets/app_icon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 100%);
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh;
            color: #e0e0e0;
        }
        .login-box {
            background: #252535;
            border-radius: 16px;
            padding: 40px;
            width: 100%; max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            border: 1px solid #3d3d4d;
        }
        .login-header {
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 30px;
        }
        .login-icon-img {
            width: 64px; height: 64px;
            border-radius: 12px;
            margin-right: 16px;
            flex-shrink: 0;
        }
        .login-title {
            display: flex; flex-direction: column;
        }
        .login-title h1 {
            font-size: 28px; font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #c0c0c0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #3d3d4d;
            border-radius: 8px;
            background: #1a1a28;
            color: #ffffff;
            font-size: 16px;
            transition: border-color 0.2s;
        }
        input[type="password"]:focus {
            outline: none;
            border-color: #2458CA;
            box-shadow: 0 0 0 3px rgba(36, 88, 202, 0.1);
        }
        .form-group.error input[type="password"] {
            border-color: #ff6b6b;
        }
        .error-msg {
            font-size: 12px;
            color: #ff6b6b;
            margin-top: 6px;
            display: none;
        }
        .form-group.error .error-msg {
            display: block;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #2458CA 0%, #1a3fa0 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        button:hover {
            box-shadow: 0 8px 24px rgba(36, 88, 202, 0.3);
        }
        button:active {
            transform: scale(0.98);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="login-header">
            <img class="login-icon-img" src="assets/app_icon.png" alt="GeoMechanicsTools">
            <div class="login-title">
                <h1>GeoMechanicsTools</h1>
            </div>
        </div>
        <form id="loginForm">
            <div class="form-group" id="passwordGroup">
                <label for="password">Clave de acceso</label>
                <input type="password" id="password" placeholder="Ingresá la clave" autofocus>
                <div class="error-msg">Clave incorrecta</div>
            </div>
            <button type="submit">Acceder</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const passwordInput = document.getElementById('password');
        const passwordGroup = document.getElementById('passwordGroup');
        const correctPassword = 'JVPC';

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const entered = passwordInput.value.trim();

            if (entered === correctPassword) {
                sessionStorage.setItem('gmt_auth', 'true');
                window.location.href = "programa/index.html";
            } else {
                passwordGroup.classList.add('error');
                passwordInput.value = '';
                passwordInput.focus();
                setTimeout(() => passwordGroup.classList.remove('error'), 3000);
            }
        });
    </script>
</body>
</html>
